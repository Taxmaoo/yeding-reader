<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>页灯 · TXT 小说阅读器</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=34">
  <script type="module" src="./app.mjs?v=34"></script>
</head>
<body>
  <div id="library" class="library">
    <header class="brand">
      <div class="brand-left">
        <img src="./icon-192.png" alt="" width="34" height="34">
        <div class="brand-title">
          <strong>页灯书架</strong>
          <span id="shelfCount" class="shelf-count">本地私密书库</span>
        </div>
      </div>
      <div class="brand-actions">
        <button id="cloudSyncBtn" class="pill-btn cloud-sync-btn" type="button" aria-label="私人云书库与备份"><span class="sync-dot" aria-hidden="true"></span><span id="cloudSyncLabel">云备份</span></button>
        <button id="viewToggle" class="pill-btn" type="button" aria-label="切换书架视图">列表</button>
        <button id="downloadBtn" class="pill-btn dl-trigger" type="button" aria-label="下载番茄小说">⤓ 下载</button>
        <button id="importBtn" class="primary pill-primary" type="button">＋ 导入 TXT</button>
        <input id="fileInput" type="file" accept=".txt,text/plain" hidden>
        <input id="backupInput" type="file" accept=".gz,.json,application/gzip,application/json" hidden>
      </div>
    </header>
    <main class="shelf">
      <section id="resumeListenCard" class="resume-card" aria-label="上次听书记录" hidden></section>

      <div id="shelfTools" class="shelf-tools" hidden>
        <input id="shelfSearch" class="shelf-search" type="search" placeholder="搜索书架里的书…" aria-label="搜索书架">
        <div id="shelfFilter" class="shelf-filter" role="tablist" aria-label="书架筛选">
          <button type="button" data-filter="all" aria-selected="true">全部</button>
          <button type="button" data-filter="listened" aria-selected="false">听过</button>
          <button type="button" data-filter="finished" aria-selected="false">已读完</button>
        </div>
      </div>

      <div id="bookList" class="book-list" data-view="grid"></div>

      <section id="empty" class="empty">
        <div class="sample-cover" aria-hidden="true"><span>山里的<br>邮局</span><span class="cover-mark">页灯</span></div>
        <div><h2>先听一篇样章</h2><p>试试多角色听书、翻页和夜间模式。</p><button id="sampleBtn" type="button">阅读《山里的邮局》 →</button></div>
      </section>
      <p id="offlineStatus" class="storage-note" role="status" hidden></p>
      <p class="storage-note">点右上角「云备份」可生成专属同步码防丢书（每位用户完全隔离不互通），也支持整库离线备份。</p>
    </main>
  </div>

  <!-- 纯净阅读页（图 1） -->
  <section id="reader" class="reader" aria-label="小说阅读器" hidden>
    <div class="reader-heading"><span id="chapterLabel"></span><span id="bookLabel"></span></div>
    <div id="viewport" class="viewport" tabindex="0" aria-label="小说正文">
      <article id="passage" class="passage"></article>
      <div id="sectionNav" class="section-nav"><button id="prevSection" type="button">上一段</button><button id="nextSection" type="button">下一段</button></div>
    </div>
    <footer class="reader-footer">
      <button id="menuToggle" type="button" aria-label="阅读菜单" aria-expanded="false">☰</button>
      <div class="reader-footer-end"><span id="readPercent">0%</span></div>
    </footer>

    <!-- 点击正文呼出的简洁菜单（图 2 / 图 3） -->
    <div id="readerMenus" hidden>
      <header class="reader-toolbar">
        <button id="backShelf" type="button" aria-label="返回书架">‹ 书架</button>
        <span id="toolbarTitle"></span>
        <div class="toolbar-right">
          <button id="markBtn" type="button" aria-label="加书签">书签＋</button>
          <button id="hideMenu" type="button" aria-label="关闭阅读菜单">×</button>
        </div>
      </header>
      <div class="reading-tools">
        <div class="jump">
          <button id="prevChapter" class="chapter-jump" type="button" aria-label="上一章">上一章</button>
          <div class="jump-track">
            <div class="jump-caption"><span id="jumpChapterTitle"></span><span id="jumpValue">0%</span></div>
            <input id="progress" type="range" min="0" max="1000" value="0" aria-label="全书进度">
          </div>
          <button id="nextChapterMenu" class="chapter-jump" type="button" aria-label="下一章">下一章</button>
        </div>
        <nav aria-label="阅读工具">
          <button id="tocBtn" type="button"><span class="nav-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span><small>目录</small></button>
          <button id="bookmarksBtn" type="button"><span class="nav-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4V4z"/></svg></span><small>书签</small></button>
          <button id="nightToggleBtn" type="button"><span class="nav-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg></span><small id="nightLabel">夜间</small></button>
          <button id="settingsBtn" type="button"><span class="nav-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 4.3v9.4L12 21l-7.5-4.3V7.3L12 3z"/><circle cx="12" cy="12" r="2.2"/></svg></span><small>设置</small></button>
        </nav>
      </div>
    </div>
  </section>

  <!-- 图 2：未听书时点击正文右下角浮现的深棕「听」小圆圈 -->
  <button id="listenFloatBtn" class="listen-float-btn" type="button" aria-label="开始听书" hidden>听</button>

  <!-- 图 3：听书进行中悬浮迷你胶囊（在书架常驻；在阅读页点击屏幕后浮现） -->
  <div id="ttsCapsule" class="tts-capsule" role="region" aria-label="听书悬浮控制" hidden>
    <button id="capsuleOpenBtn" class="capsule-cover-btn" type="button" aria-label="进入听书页面">
      <span id="capsuleDisc" class="capsule-disc" data-tone="0"><span id="capsuleChar">书</span></span>
    </button>
    <button id="capsulePlayBtn" class="capsule-icon-btn capsule-play" type="button" aria-label="播放或暂停"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.6"/><rect x="14" y="5" width="4" height="14" rx="1.6"/></svg></button>
    <button id="capsuleVoiceBtn" class="capsule-icon-btn" type="button" aria-label="音色设置">⇄</button>
    <button id="capsuleCloseBtn" class="capsule-icon-btn" type="button" aria-label="退出听书">×</button>
  </div>

  <!-- 图 4：番茄 1:1 橄榄绿沉浸「智能朗读」页面 -->
  <section id="listenView" class="listen-view" aria-label="智能朗读页面" hidden>
    <header class="listen-header">
      <button id="listenMinBtn" class="listen-top-btn" type="button" aria-label="收起听书页">⌄</button>
      <span class="listen-header-title">智能朗读</span>
      <button id="listenExitBtn" class="listen-top-btn listen-exit-text" type="button" aria-label="退出听书">退出</button>
    </header>

    <button id="listenBookRow" class="listen-book-row" type="button" aria-label="查看目录">
      <div id="listenCover" class="listen-cover" data-tone="0">书</div>
      <div class="listen-book-meta">
        <strong id="listenChapter">正在准备…</strong>
        <span id="listenBookTitle"></span>
      </div>
      <span class="listen-chevron" aria-hidden="true">›</span>
    </button>

    <div id="listenLyrics" class="listen-lyrics" aria-live="polite"></div>

    <div class="listen-panel">
      <div class="listen-action-bar">
        <button id="listenRateBtn" type="button"><span class="la-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2h5"/></svg></span><small id="listenRateLabel">1.0x</small></button>
        <button id="listenToReaderBtn" type="button"><span class="la-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v17H6.5A2.5 2.5 0 0 0 4 22V5.5zM20 5.5A2.5 2.5 0 0 0 17.5 3H12v17h5.5a2.5 2.5 0 0 1 2.5 2V5.5z"/></svg></span><small>看正文</small></button>
        <button id="listenVoiceMoreBtn" type="button"><span class="la-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></span><small>音色</small></button>
        <button id="listenMoreBtn" type="button"><span class="la-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="15.5" cy="12" r="1" fill="currentColor"/></svg></span><small>设置</small></button>
      </div>

      <div class="listen-progress-row">
        <button id="listenBackSec" class="listen-sec-btn" type="button">-15s</button>
        <div class="listen-progress-bar"><span id="listenProgressFill"></span></div>
        <span id="listenProgressText" class="listen-pct-text">0%</span>
      </div>

      <div class="listen-transport">
        <button id="listenTocBtn" class="listen-side-btn" type="button"><span class="lt-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h11"/></svg></span><small>目录</small></button>
        <button id="listenPrevBtn" class="listen-skip-btn" type="button" aria-label="上一章"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4.5" y="5.5" width="2.4" height="13" rx="1.2"/><path d="M18.2 6.1a1.2 1.2 0 0 1 1.8 1.03v9.74a1.2 1.2 0 0 1-1.8 1.03L9.3 13.03a1.2 1.2 0 0 1 0-2.06l8.9-4.87z"/></svg></button>
        <button id="listenPlayBtn" class="listen-play-btn" type="button" aria-label="播放或暂停"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4.5" width="4.4" height="15" rx="2"/><rect x="14.1" y="4.5" width="4.4" height="15" rx="2"/></svg></button>
        <button id="listenNextBtn" class="listen-skip-btn" type="button" aria-label="下一章"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.8 6.1a1.2 1.2 0 0 0-1.8 1.03v9.74a1.2 1.2 0 0 0 1.8 1.03l8.9-4.87a1.2 1.2 0 0 0 0-2.06L5.8 6.1z"/><rect x="17.1" y="5.5" width="2.4" height="13" rx="1.2"/></svg></button>
        <button id="listenSleepBtn" class="listen-side-btn" type="button"><span class="lt-ico" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 1.5M5 4l3 2M19 4l-3 2"/></svg></span><small id="listenSleepLabel">定时</small></button>
      </div>

      <div class="listen-bottom-cards">
        <div class="listen-card listen-voice-card">
          <button id="listenVoiceCardHead" class="listen-card-head" type="button">
            <span>音色设置</span><span aria-hidden="true">›</span>
          </button>
          <div id="listenQuickVoices" class="listen-quick-voices"></div>
        </div>
        <button id="listenReadCard" class="listen-card listen-read-card" type="button">
          <div class="listen-card-head"><span>边听边读</span><span aria-hidden="true">›</span></div>
          <p id="listenReadChapter" class="listen-read-chapter"></p>
        </button>
      </div>
    </div>
  </section>

  <dialog id="dialog" aria-labelledby="dialogTitle">
    <header class="dialog-header"><h2 id="dialogTitle"></h2><button id="closeDialog" type="button" aria-label="关闭">×</button></header>
    <div id="dialogBody"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
