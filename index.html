<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f3e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>页灯 · TXT 小说阅读器</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <div id="library" class="library">
    <header class="brand">
      <div class="brand-left">
        <img src="./icon-192.png" alt="" width="34" height="34">
        <div class="brand-title">
          <strong>页灯书架</strong>
          <span id="shelfCount" class="shelf-count">本地私密书库</span>
        </div>
      </div>
      <div class="brand-actions">
        <button id="viewToggle" class="pill-btn" type="button" aria-label="切换书架视图">列表</button>
        <button id="importBtn" class="primary pill-primary" type="button">＋ 导入 TXT</button>
        <input id="fileInput" type="file" accept=".txt,text/plain" hidden>
      </div>
    </header>
    <main class="shelf">
      <section id="resumeListenCard" class="resume-card" aria-label="上次听书记录" hidden></section>

      <div id="shelfTools" class="shelf-tools" hidden>
        <input id="shelfSearch" class="shelf-search" type="search" placeholder="搜索书架里的书…" aria-label="搜索书架">
        <div id="shelfFilter" class="shelf-filter" role="tablist" aria-label="书架筛选">
          <button type="button" data-filter="all" aria-selected="true">全部</button>
          <button type="button" data-filter="listened" aria-selected="false">听过</button>
          <button type="button" data-filter="finished" aria-selected="false">已读完</button>
        </div>
      </div>

      <div id="bookList" class="book-list" data-view="grid"></div>

      <section id="empty" class="empty">
        <div class="sample-cover" aria-hidden="true"><span>山里的<br>邮局</span><span class="cover-mark">页灯</span></div>
        <div><h2>先听一篇样章</h2><p>试试多角色听书、翻页和夜间模式。</p><button id="sampleBtn" type="button">阅读《山里的邮局》 →</button></div>
      </section>
      <p id="offlineStatus" class="storage-note" role="status" hidden></p>
      <p class="storage-note">书架与听书进度仅保存在本机浏览器中。可点书封右上角 ⋯ 导出 TXT 备份。</p>
    </main>
  </div>

  <section id="reader" class="reader" aria-label="小说阅读器" hidden>
    <div class="reader-heading"><span id="chapterLabel"></span><span id="bookLabel"></span></div>
    <div id="viewport" class="viewport" tabindex="0" aria-label="小说正文">
      <article id="passage" class="passage"></article>
      <div id="sectionNav" class="section-nav"><button id="prevSection" type="button">上一段</button><button id="nextSection" type="button">下一段</button></div>
    </div>
    <footer class="reader-footer">
      <button id="menuToggle" type="button" aria-label="阅读菜单" aria-expanded="false">☰</button>
      <div class="reader-footer-end">
        <button id="quickListenBtn" class="quick-listen" type="button" aria-label="听书">🎧 听书</button>
        <span id="readPercent">0%</span>
      </div>
    </footer>
    <section id="ttsBar" class="tts-bar" aria-label="听书控制台" hidden>
      <div class="tts-bar-top">
        <span id="ttsStatus" class="tts-status">准备听书…</span>
        <div class="tts-top-actions">
          <button id="ttsCollapse" class="tts-icon-btn" type="button" aria-label="收起听书栏" title="收起听书栏">⌄</button>
          <button id="ttsClose" class="tts-icon-btn" type="button" aria-label="退出听书" title="退出听书">×</button>
        </div>
      </div>
      <div class="tts-bar-controls">
        <button id="ttsPrev" class="tts-btn" type="button" aria-label="上一段">‹ 上段</button>
        <button id="ttsPlay" class="tts-play" type="button" aria-label="播放或暂停">播放</button>
        <button id="ttsNext" class="tts-btn" type="button" aria-label="下一段">下段 ›</button>
        <button id="ttsRate" class="tts-btn" type="button" aria-label="切换语速">1.0x</button>
        <button id="ttsSleep" class="tts-btn" type="button" aria-label="定时关闭">定时</button>
        <button id="ttsConfig" class="tts-btn" type="button" aria-label="音色与设置">音色</button>
      </div>
    </section>
    <div id="readerMenus" hidden>
      <header class="reader-toolbar"><button id="backShelf" type="button">‹ 书架</button><span id="toolbarTitle"></span><button id="hideMenu" type="button" aria-label="关闭阅读菜单">×</button></header>
      <div class="reading-tools">
        <div class="jump">
          <button id="prevChapter" class="chapter-jump" type="button" aria-label="上一章"><span aria-hidden="true">‹</span><small>上一章</small></button>
          <div class="jump-track"><div class="jump-caption"><span id="jumpChapterTitle"></span><span id="jumpValue">0%</span></div><input id="progress" type="range" min="0" max="1000" value="0" aria-label="全书进度"></div>
          <button id="nextChapterMenu" class="chapter-jump" type="button" aria-label="下一章"><span aria-hidden="true">›</span><small>下一章</small></button>
        </div>
        <nav aria-label="阅读工具"><button id="tocBtn" type="button">目录</button><button id="listenBtn" type="button">听书</button><button id="bookmarksBtn" type="button">书签</button><button id="markBtn" type="button">加书签</button><button id="settingsBtn" type="button">Aa 设置</button></nav>
      </div>
    </div>
  </section>

  <dialog id="dialog" aria-labelledby="dialogTitle">
    <header class="dialog-header"><h2 id="dialogTitle"></h2><button id="closeDialog" type="button" aria-label="关闭">×</button></header>
    <div id="dialogBody"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
